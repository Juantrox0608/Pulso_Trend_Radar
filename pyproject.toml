[project]
name = "radar"
version = "0.1.0"
description = "Buscador de tendencias en YouTube, TikTok y LinkedIn"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
