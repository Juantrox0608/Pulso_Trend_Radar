[project]
name = "radar-main-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["radar-ai-service>=0.1,<0.2", "fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
